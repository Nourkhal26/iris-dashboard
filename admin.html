<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Admin — Client Management</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2035;--bg2:#212840;--bg3:#262f4a;
  --grn:#4dcc6e;--grn-d:rgba(77,204,110,0.12);
  --brd:rgba(255,255,255,0.07);--brd2:rgba(255,255,255,0.12);
  --t1:#edf5ee;--t2:rgba(255,255,255,0.55);--t3:rgba(255,255,255,0.3);
}
body{background:var(--bg);font-family:'Inter',sans-serif;min-height:100vh;color:var(--t1)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:10}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-wrap img{width:32px;height:32px;border-radius:7px}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#fff;letter-spacing:.05em}
.topbar-r{display:flex;align-items:center;gap:12px}
.admin-badge{font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--grn-d);color:var(--grn);border:1px solid rgba(77,204,110,0.2)}
.btn-logout{background:transparent;border:1px solid var(--brd2);border-radius:7px;color:var(--t2);font-size:11px;padding:5px 12px;cursor:pointer;transition:all .15s}
.btn-logout:hover{color:#f06050;border-color:#f06050}
.main{padding:28px 24px;max-width:1100px;margin:0 auto}
.page-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#fff;margin-bottom:6px}
.page-sub{font-size:12px;color:var(--t3);margin-bottom:28px}
.sec-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grn);margin-bottom:12px}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:32px}
.client-card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:20px;transition:border-color .15s;cursor:pointer}
.client-card:hover{border-color:var(--grn)}
.client-card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.client-icon{width:40px;height:40px;border-radius:10px;background:var(--grn-d);border:1px solid rgba(77,204,110,0.2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--grn);font-family:'Cormorant Garamond',serif;flex-shrink:0}
.client-name{font-size:15px;font-weight:600;color:#fff;margin-bottom:2px}
.client-meta{font-size:11px;color:var(--t3)}
.client-stats{display:flex;gap:16px;margin-bottom:16px}
.cstat{font-size:11px;color:var(--t2)}
.cstat strong{display:block;font-family:'DM Mono',monospace;font-size:14px;color:#fff;margin-bottom:1px}
.btn-view{width:100%;background:var(--bg3);border:1px solid var(--brd2);border-radius:7px;color:var(--t1);font-size:12px;font-weight:500;padding:8px;cursor:pointer;transition:all .15s;text-align:center}
.btn-view:hover{background:var(--grn);color:#0a1a0f;border-color:var(--grn)}
.sheet-status{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:14px}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-connected{background:#4dcc6e}
.status-missing{background:#f06050}
.sheet-url-label{font-size:10px;color:var(--t3)}
</style>
</head>

    <div class="logo">Iris Sales Group</div>
  </div>
  <div class="topbar-r">
    <span class="admin-badge" id="role-badge">Admin</span>
    <span style="font-size:11px;color:var(--t3)" id="user-email"></span>
    <button class="btn-logout" onclick="Auth.logout()">Sign out</button>
  </div>
</div>

<div class="main">
  <div class="page-title">Client Dashboard</div>
  <div class="page-sub">Select a client to view their performance dashboard</div>

  <div class="sec-label">Active clients</div>
  <div class="client-grid" id="client-grid"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const session = Auth.requireAuth(['admin', 'team']);
if (session) {
  document.getElementById('user-email').textContent = session.email;
  document.getElementById('role-badge').textContent = session.role === 'admin' ? 'Admin' : 'Team';

  const grid = document.getElementById('client-grid');
  IRIS_CONFIG.clients.forEach(client => {
    const hasSheet = !!client.sheetUrl;
    const initial = client.name.charAt(0).toUpperCase();
    grid.innerHTML += `
      <div class="client-card" onclick="viewClient('${client.id}')">
        <div class="client-card-top">
          <div class="client-icon">${initial}</div>
          <div>
            <div class="client-name">${client.name}</div>
            <div class="client-meta">${client.users.length} user${client.users.length !== 1 ? 's' : ''} · ${client.closers.length} closers</div>
          </div>
        </div>
        <div class="sheet-status">
          <div class="status-dot ${hasSheet ? 'status-connected' : 'status-missing'}"></div>
          <span style="color:${hasSheet ? '#4dcc6e' : '#f06050'}">${hasSheet ? 'Google Sheet connected' : 'No sheet connected — add URL in config.js'}</span>
        </div>
        <div class="client-stats">
          <div class="cstat"><strong>${client.closers.join(', ') || '—'}</strong>Closers</div>
        </div>
        <button class="btn-view">View Dashboard →</button>
      </div>
    `;
  });
}

function viewClient(clientId) {
  sessionStorage.setItem('iris_viewing_client', clientId);
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
