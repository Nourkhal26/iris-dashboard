<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Sales Group — Dashboard</title>
<link rel="icon" id="favicon-link" type="image/png" href="">
<script>
  // Favicon is set on load by copying the embedded logo image already in the page
  window.addEventListener('DOMContentLoaded', function(){
    var logoImg = document.querySelector('.footer-l img') || document.querySelector('.logo-wrap img');
    if (logoImg) document.getElementById('favicon-link').href = logoImg.src;
  });
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2035;--bg-card:#212840;--bg-card2:#262f4a;
  --brd:rgba(255,255,255,0.07);--brd2:rgba(255,255,255,0.12);
  --t1:#edf5ee;--t2:#7a9e82;--t3:rgba(255,255,255,0.3);
  --grn:#4dcc6e;--grn-d:rgba(77,204,110,0.13);
  --blu:#5ab4f0;--amb:#e8b84b;--red:#f06050;--tel:#3ddbb8;--pur:#a78bfa;
}
body{background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;min-height:100vh;font-family:"Inter",sans-serif}
.topbar{display:flex;align-items:center;padding:0 24px;height:58px;background:var(--bg-card);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:20;gap:12px;flex-wrap:wrap}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-wrap img{width:32px;height:32px;border-radius:7px}
.logo{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:600;color:#fff;letter-spacing:.05em}
.period-badge{font-size:11px;font-weight:600;padding:5px 12px;border-radius:6px;background:var(--grn);color:#0a1a0f;white-space:nowrap}
.topbar-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.cap-label{font-size:11px;color:var(--t3);font-family:"DM Mono",monospace}
.range-wrap{display:flex;gap:6px}
.range-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--brd2);background:var(--bg-card);color:var(--t3);cursor:pointer;transition:all .15s}
.range-btn.active{border-color:var(--grn);color:var(--grn);background:var(--grn-d)}
.main{padding:20px 24px;display:flex;flex-direction:column;gap:18px;max-width:1440px;margin:0 auto}
.sec-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--grn);margin-bottom:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}.grid21{grid-template-columns:1fr}}
@media(max-width:600px){.grid4{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

@media(max-width:640px){
  .topbar{padding:10px 14px;height:auto;flex-direction:column;align-items:flex-start;gap:8px}
  .logo-wrap img{width:26px;height:26px}
  .logo{font-size:16px}
  .period-badge{font-size:10px;padding:4px 9px}
  .range-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .range-btn{flex-shrink:0;font-size:11px;padding:5px 11px}
  .topbar-r{margin-left:0;width:100%}
  .main{padding:14px 12px;gap:14px}
  .mcard{padding:13px 14px;min-height:90px}
  .mval{font-size:21px}
  .mlabel{font-size:9px}
  .ccard{padding:14px 14px}
  .ctitle{font-size:12px}
  .thead2{padding:12px 14px 10px;font-size:12px}
  .ct thead th{padding:7px 10px;font-size:8px}
  .ct tbody td{padding:9px 10px;font-size:11px}
  .ct tbody td:not(:first-child){font-size:10px}
  .av{width:24px;height:24px;font-size:9px}
  .cn{gap:7px}
  canvas{max-width:100%}
  .ccard > div[style*="position:relative"]{height:170px !important}
}
.mcard{background:var(--bg-card);border:1px solid var(--brd);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;min-height:110px;display:flex;flex-direction:column}
.accent-bar{position:absolute;top:0;left:0;right:0;height:2px}
.mlabel{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:8px}
.mval{font-family:"DM Mono",monospace;font-size:26px;font-weight:500;line-height:1;margin-bottom:4px}
.msub{font-size:11px;color:rgba(255,255,255,0.25);margin-top:auto;padding-top:8px}
.ccard{background:var(--bg-card);border:1px solid var(--brd);border-radius:12px;padding:18px 20px}
.ctitle{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.ctitle span{font-size:10px;color:var(--t3);font-weight:400}
.tcard{background:var(--bg-card);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.thead2{padding:14px 18px 12px;border-bottom:1px solid var(--brd);font-size:13px;font-weight:600;color:var(--t1)}
table.ct{width:100%;border-collapse:collapse;min-width:640px}
.ct thead th{padding:9px 16px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grn);text-align:left;border-bottom:1px solid var(--brd);background:var(--bg-card2)}
.ct thead th:not(:first-child){text-align:right}
.ct tbody tr{border-bottom:1px solid rgba(255,255,255,0.04)}
.ct tbody tr:hover{background:rgba(255,255,255,0.03)}
.ct tbody td{padding:11px 16px;font-size:12px;color:var(--t1)}
.ct tbody td:not(:first-child){text-align:right;font-family:"DM Mono",monospace;font-size:11px}
.av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.cn{display:flex;align-items:center;gap:9px;font-weight:600}
.pip-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.pip-row:last-child{border-bottom:none}
.pip-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.pip-name{font-size:12px;color:rgba(255,255,255,0.7);flex:1;margin-left:10px;font-weight:500}
.pip-bar-wrap{width:80px;margin-right:12px}
.pip-bar-bg{height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.pip-bar-fill{height:100%;border-radius:3px}
.pip-n{font-family:"DM Mono",monospace;font-size:11px;color:rgba(255,255,255,0.3);margin-right:12px;width:20px;text-align:center}
.pip-v{font-family:"DM Mono",monospace;font-size:12px;color:#fff;font-weight:500;min-width:72px;text-align:right}
.stat-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.stat-row:last-child{border-bottom:none}
.stat-name{font-size:12px;color:rgba(255,255,255,0.75);font-weight:500;flex:1;min-width:70px}
.stat-bar-wrap{flex:1;margin:0 12px;background:rgba(255,255,255,0.07);border-radius:4px;height:5px;overflow:hidden}
.stat-bar{height:100%;border-radius:4px;background:var(--grn)}
.stat-val{font-family:"DM Mono",monospace;font-size:11px;color:#fff;width:24px;text-align:right}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100}
.spinner{width:32px;height:32px;border:2px solid var(--brd2);border-top-color:var(--grn);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--t3)}
.progress-bar-wrap{width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:var(--grn);border-radius:2px;transition:width .3s ease}
.error-box{background:rgba(240,96,80,0.08);border:1px solid rgba(240,96,80,0.2);border-radius:10px;padding:20px;text-align:center;color:#f06050;font-size:13px;line-height:1.7;margin:24px}
.error-box strong{display:block;margin-bottom:4px;font-size:15px}

/* Login gate */
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200}
.login-card{background:var(--bg-card);border:1px solid var(--brd2);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.login-logo{width:48px;height:48px;border-radius:10px;margin-bottom:14px}
.login-title{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:#fff;letter-spacing:.04em;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--t3);margin-bottom:24px}
.login-input{width:100%;background:var(--bg-card2);border:1px solid var(--brd2);border-radius:8px;color:var(--t1);font-size:14px;padding:11px 14px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px}
.login-input:focus{border-color:var(--grn)}
.login-btn{width:100%;background:var(--grn);color:#0a1a0f;border:none;border-radius:8px;font-size:13px;font-weight:700;padding:11px;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.88}
.login-error{color:var(--red);font-size:12px;margin-top:10px;display:none}
.footer{padding:14px 24px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.footer-l{display:flex;align-items:center;gap:8px;font-size:10px;color:rgba(255,255,255,0.2)}
.footer-r{font-size:10px;color:rgba(255,255,255,0.2);font-family:"DM Mono",monospace}

/* Login screen */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--bg-card);border:1px solid var(--brd2);border-radius:14px;padding:32px 28px;text-align:center}
.login-card img{width:48px;height:48px;border-radius:10px;margin-bottom:14px}
.login-card h1{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;color:#fff;letter-spacing:.04em;margin-bottom:4px}
.login-card p{font-size:12px;color:var(--t3);margin-bottom:22px}
.login-card input{width:100%;background:var(--bg);border:1px solid var(--brd2);border-radius:8px;color:#fff;font-size:14px;padding:11px 14px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:.05em}
.login-card input:focus{border-color:var(--grn)}
.login-card button{width:100%;background:var(--grn);color:#0a1a0f;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:11px;cursor:pointer;transition:opacity .15s}
.login-card button:hover{opacity:.88}
.login-error{color:#f06050;font-size:12px;margin-top:10px;display:none}
.logout-btn{background:transparent;border:1px solid var(--brd2);border-radius:7px;color:var(--t3);font-size:11px;padding:5px 12px;cursor:pointer;transition:all .15s}
.logout-btn:hover{color:#f06050;border-color:#f06050}
</style>
</head>

// Normalize a header key
function norm(k) {
  return (k||'').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
}

// Find the right column key from a row
function findColKey(sampleRow, terms) {
  var keys = Object.keys(sampleRow);
  // Prioritize by term order first (most specific/intended term wins),
  // then by column order within that term.
  for (var j=0; j<terms.length; j++) {
    for (var i=0; i<keys.length; i++) {
      var n = norm(keys[i]);
      if (n.indexOf(terms[j]) > -1) return keys[i];
    }
  }
  return null;
}

// Parse CSV text into array of objects
function parseCSV(text) {
  // Split into logical CSV rows first, respecting quoted newlines/commas
  var allLines = splitCSVRecords(text);
  if (allLines.length < 2) return [];
  var headers = allLines[0].map(function(h){ return h.replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim(); });
  var rows = [];
  for (var i=1; i<allLines.length; i++) {
    var vals = allLines[i];
    var obj = {};
    headers.forEach(function(h, idx) {
      obj[h] = (vals[idx]||'').trim();
    });
    if (obj[headers[0]] && obj[headers[0]].match(/\d/)) rows.push(obj);
  }
  return rows;
}

// Splits full CSV text into an array of records, each an array of fields.
// Properly handles quoted fields that contain commas or embedded newlines.
function splitCSVRecords(text) {
  var records = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); field=''; records.push(row); row=[]; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); records.push(row); }
  return records.filter(function(r){ return r.length>1 || (r[0] && r[0].trim()); });
}

// Fetch one tab via Cloudflare Worker
function fetchTab(tabName) {
  var url = 'https://morning-water-057d.nour-2ba.workers.dev/?sheet=' + encodeURIComponent(tabName);
  return fetch(url)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(t){
      if(!t || t.length < 20) return [];
      var rows = parseCSV(t);
      console.log('Tab '+tabName+': '+rows.length+' rows');
      return rows;
    })
    .catch(function(e){
      console.warn('Tab '+tabName+' failed: '+e.message);
      return [];
    });
}

// Fetch all tabs and combine
function fetchAllTabs() {
  var progress = document.getElementById('progress-bar');
  var label = document.getElementById('loading-text');
  var completed = 0;
  
  var promises = TABS.map(function(tab) {
    return fetchTab(tab).then(function(rows) {
      completed++;
      var pct = (completed / TABS.length) * 100;
      progress.style.width = pct + '%';
      label.textContent = 'Loading ' + tab + '... (' + completed + '/' + TABS.length + ')';
      return rows;
    });
  });
  
  return Promise.all(promises).then(function(results) {
    var combined = [];
    results.forEach(function(rows) { combined = combined.concat(rows); });
    return combined;
  });
}

// Date range
function getRange(range) {
  var now = new Date(), start = new Date(now);
  if (range === 'mtd') start = new Date(now.getFullYear(), now.getMonth(), 1);
  else if (range === '30d') start.setDate(start.getDate()-30);
  else if (range === '90d') start.setDate(start.getDate()-90);
  else if (range === '180d') start.setDate(start.getDate()-180);
  else if (range === '365d') start.setDate(start.getDate()-365);
  else if (range === 'all') start = new Date('2020-01-01');
  return {start:start, end:now};
}

function setRange(btn, r) {
  currentRange = r;
  document.querySelectorAll('.range-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function parseDate(s) {
  if (!s) return null;
  s = s.toString().trim();
  if (!s || s === '' || s === 'Date') return null;
  
  // Remove any time component
  s = s.split(' ')[0].split('T')[0];
  
  var parts = s.split('/');
  if (parts.length >= 2) {
    var m = parseInt(parts[0]);
    var d = parseInt(parts[1]);
    if (isNaN(m) || isNaN(d)) return null;
    var yr;
    if (parts.length === 3) {
      yr = parseInt(parts[2]);
      if (yr < 100) yr += 2000;
    } else {
      // MM/DD only — figure out year from context
      yr = new Date().getFullYear();
      // If month hasn't happened yet this year, it might be last year
      var now = new Date();
      var testDate = new Date(yr, m-1, d);
      if (testDate > now) yr -= 1;
    }
    var result = new Date(yr, m-1, d);
    return isNaN(result.getTime()) ? null : result;
  }
  return null;
}

function parseMoney(s) {
  if (!s) return 0;
  var n = parseFloat(s.replace(/[$,\s"]/g,''));
  return isNaN(n) ? 0 : n;
}

function fmt$(n) { return '$' + Math.round(n).toLocaleString(); }

// Find columns dynamically from a sample row
var COLS = {};
function detectCols(rows) {
  if (!rows.length) return;
  // Find the row with the MOST columns (most complete schema)
  var sample = rows[0];
  var maxKeys = Object.keys(sample).length;
  rows.forEach(function(r){
    var n = Object.keys(r).length;
    if (n > maxKeys) { maxKeys = n; sample = r; }
  });
  COLS.date = findColKey(sample, ['date','d']) || 'Date';
  COLS.cash = findColKey(sample, ['cash']) || 'Cash';
  COLS.contract = findColKey(sample, ['revenue']) || 'Revenue';
  COLS.product = findColKey(sample, ['top','inc','product']) || 'TOP/INC';
  COLS.setter = findColKey(sample, ['setter']) || 'Setter';
  COLS.closer = findColKey(sample, ['closer','sales person']) || 'Sales Person/ Closer';
  console.log('Final COLS:', JSON.stringify(COLS));
  console.log('Sample row keys:', JSON.stringify(Object.keys(sample)));
  console.log('COLS detected:', COLS);
}

// Render
function render() {
  var dr = getRange(currentRange);
  var filtered = allRows.filter(function(r) {
    var d = parseDate(r[COLS.date]);
    return d && d >= dr.start && d <= dr.end;
  });

  var periodStr = dr.start.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' - ' + dr.end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('period-badge').textContent = 'Capitalism.com - ' + periodStr;
  document.getElementById('footer-period').textContent = 'Total rows: ' + allRows.length + ' | Filtered: ' + filtered.length;

  var totalCash=0, totalContract=0;
  filtered.forEach(function(r){
    totalCash += parseMoney(r[COLS.cash]);
    totalContract += parseMoney(r[COLS.contract]);
  });
  var deals = filtered.filter(function(r){ return parseMoney(r[COLS.cash])>0; }).length;
  var avgCash = deals>0 ? totalCash/deals : 0;

  // Closers
  var cMap = {};
  filtered.forEach(function(r){
    var c = (r[COLS.closer]||'Unassigned').trim();
    if (!c) c = 'Unassigned';
    if (!cMap[c]) cMap[c]={cash:0,contract:0,deals:0};
    var cash = parseMoney(r[COLS.cash]);
    var rev = parseMoney(r[COLS.contract]);
    cMap[c].cash += cash;
    cMap[c].contract += rev;
    if (cash > 0) cMap[c].deals++;
  });
  var closers = Object.entries(cMap).filter(function(c){ return c[1].cash > 0; }).sort(function(a,b){ return b[1].cash-a[1].cash; });

  // Setters
  var sMap = {};
  filtered.forEach(function(r){
    var s = (r[COLS.setter]||'').trim();
    if (!s || s==='N/A' || s==='N/a') return;
    s.split('/').forEach(function(n){
      n = n.trim();
      if (n) { if(!sMap[n])sMap[n]=0; sMap[n]++; }
    });
  });
  var setters = Object.entries(sMap).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);

  // Products
  var pMap = {};
  filtered.forEach(function(r){
    var p = (r[COLS.product]||'Other').trim();
    if (!p) p = 'Other';
    if (p.toUpperCase().indexOf('TOP')>-1 && p.toLowerCase().indexOf('accel')==-1 && p.toLowerCase().indexOf('renewal')==-1) p='TOP Program';
    else if (p.toLowerCase().indexOf('renewal')>-1) p='Renewal';
    else if (p.toLowerCase().indexOf('accel')>-1) p='Accelerator';
    if (!pMap[p]) pMap[p]={count:0,value:0};
    pMap[p].count++;
    pMap[p].value += parseMoney(r[COLS.contract]);
  });
  var products = Object.entries(pMap).filter(function(p){ return p[1].value>0; }).sort(function(a,b){ return b[1].value-a[1].value; });

  // Daily cash
  var dMap = {};
  filtered.forEach(function(r){
    var d = parseDate(r[COLS.date]);
    if (!d) return;
    var k = d.toISOString().split('T')[0];
    if (!dMap[k]) dMap[k]=0;
    dMap[k] += parseMoney(r[COLS.cash]);
  });
  var days = Object.keys(dMap).sort();
  var dayLabels = days.map(function(d){
    var dt = new Date(d+'T12:00:00');
    return (dt.getMonth()+1)+'/'+(dt.getDate());
  });
  var dayVals = days.map(function(d){ return dMap[d]; });

  // Build HTML
  var pColors = ['var(--grn)','var(--blu)','var(--amb)','var(--tel)','var(--pur)'];
  var maxP = products[0] ? products[0][1].value : 1;
  var productHTML = products.map(function(p,i){
    return '<div class="pip-row"><div class="pip-dot" style="background:'+pColors[i%5]+'"></div><div class="pip-name">'+p[0]+'</div><div class="pip-bar-wrap"><div class="pip-bar-bg"><div class="pip-bar-fill" style="width:'+(p[1].value/maxP*100)+'%;background:'+pColors[i%5]+'"></div></div></div><div class="pip-n">'+p[1].count+'</div><div class="pip-v">'+fmt$(p[1].value)+'</div></div>';
  }).join('') || '<div style="color:rgba(255,255,255,0.3);font-size:12px">No data</div>';

  var maxS = setters[0] ? setters[0][1] : 1;
  var setterHTML = setters.map(function(s){
    return '<div class="stat-row"><div class="stat-name">'+s[0]+'</div><div class="stat-bar-wrap"><div class="stat-bar" style="width:'+(s[1]/maxS*100)+'%"></div></div><div class="stat-val">'+s[1]+'</div></div>';
  }).join('') || '<div style="color:rgba(255,255,255,0.3);font-size:12px">No data</div>';

  var closerHTML = closers.map(function(c,i){
    var col = CLOSER_COLORS[i%CLOSER_COLORS.length];
    var avg = c[1].deals>0 ? c[1].cash/c[1].deals : 0;
    return '<tr><td><div class="cn"><div class="av" style="background:'+col+'22;color:'+col+'">'+c[0].charAt(0)+'</div>'+c[0]+'</div></td><td>'+fmt$(c[1].contract)+'</td><td style="color:#fff;font-weight:600">'+fmt$(c[1].cash)+'</td><td>'+c[1].deals+'</td><td>'+fmt$(avg)+'</td><td>'+fmt$(avg)+'</td></tr>';
  }).join('') || '<tr><td colspan="6" style="text-align:center;color:rgba(255,255,255,0.3);padding:20px">No data for this period</td></tr>';

  document.getElementById('main-content').innerHTML =
    '<div><div class="sec-label">Revenue &amp; cash</div><div class="grid4">' +
    '<div class="mcard"><div class="accent-bar" style="background:var(--tel)"></div><div class="mlabel">Revenue</div><div class="mval" style="color:var(--tel)">'+fmt$(totalContract)+'</div></div>' +
    '<div class="mcard"><div class="accent-bar" style="background:var(--grn)"></div><div class="mlabel">Cash Collected</div><div class="mval" style="color:var(--grn)">'+fmt$(totalCash)+'</div><div class="msub">'+deals+' deals</div></div>' +
    '<div class="mcard"><div class="accent-bar" style="background:var(--blu)"></div><div class="mlabel">Deals Closed</div><div class="mval" style="color:var(--blu)">'+deals+'</div></div>' +
    '<div class="mcard"><div class="accent-bar" style="background:var(--amb)"></div><div class="mlabel">Avg Cash / Deal</div><div class="mval" style="color:var(--amb)">'+fmt$(avgCash)+'</div><div class="msub">Cash divided by deals</div></div>' +
    '</div></div>' +
    '<div><div class="sec-label">Sales Leaderboard</div><div class="tcard"><div class="thead2">Individual closer breakdown</div><div style="overflow-x:auto"><table class="ct"><thead><tr><th>Closer</th><th>Revenue</th><th>Cash Collected</th><th>Deals Won</th><th>Avg Cash / Deal</th><th>Avg Cash Collected</th></tr></thead><tbody>'+closerHTML+'</tbody></table></div></div></div>' +
    '<div class="grid21"><div class="ccard"><div class="ctitle">Cash collected by day <span>'+periodStr+'</span></div><div style="position:relative;height:190px"><canvas id="revChart"></canvas></div></div>' +
    '<div class="ccard"><div class="ctitle">Product mix</div>'+productHTML+'<div class="ctitle" style="margin-top:18px;margin-bottom:10px">Closed deals set by setter</div>'+setterHTML+'</div></div>' +
    '<div class="grid2"><div class="ccard"><div class="ctitle">Revenue by closer</div><div style="position:relative;height:200px"><canvas id="closerRevChart"></canvas></div></div><div class="ccard"><div class="ctitle">Cash collected by closer</div><div style="position:relative;height:200px"><canvas id="closerCashChart"></canvas></div></div></div>' +
    '<div class="ccard"><div class="ctitle">Signed revenue distribution by closer</div><div style="position:relative;height:240px"><canvas id="revPieChart"></canvas></div></div>';

  // Charts
  Object.values(charts).forEach(function(c){c.destroy();}); charts={};
  var gc='rgba(255,255,255,0.05)',tc='rgba(255,255,255,0.25)';
  var cNames=closers.map(function(c){return c[0].split(' ')[0];});
  var cCash=closers.map(function(c){return Math.round(c[1].cash);});
  var cRev=closers.map(function(c){return Math.round(c[1].contract);});
  var cColors=closers.map(function(_,i){return CLOSER_COLORS[i%CLOSER_COLORS.length];});
  var cDim=closers.map(function(_,i){return CLOSER_DIM[i%CLOSER_DIM.length];});

  if (dayLabels.length) {
    charts.rev = new Chart(document.getElementById('revChart'),{type:'bar',data:{labels:dayLabels,datasets:[{data:dayVals,backgroundColor:'rgba(77,204,110,0.65)',borderColor:'#4dcc6e',borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '$'+Math.round(c.raw).toLocaleString();}}}},scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:9},autoSkip:true,maxTicksLimit:20,maxRotation:45}},y:{grid:{color:gc},ticks:{color:tc,font:{size:9},callback:function(v){return v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v;}}}}}});
  }
  if (cNames.length) {
    charts.cRev = new Chart(document.getElementById('closerRevChart'),{type:'bar',data:{labels:cNames,datasets:[{data:cRev,backgroundColor:cDim,borderColor:cColors,borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '$'+c.raw.toLocaleString();}}}},scales:{x:{grid:{color:gc},ticks:{color:'rgba(255,255,255,0.5)',font:{size:11}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:9},callback:function(v){return '$'+(v/1000).toFixed(0)+'k';}}}}}});
    charts.cCash = new Chart(document.getElementById('closerCashChart'),{type:'bar',data:{labels:cNames,datasets:[{data:cCash,backgroundColor:cDim,borderColor:cColors,borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '$'+c.raw.toLocaleString();}}}},scales:{x:{grid:{color:gc},ticks:{color:'rgba(255,255,255,0.5)',font:{size:11}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:9},callback:function(v){return '$'+(v/1000).toFixed(0)+'k';}}}}}});
    charts.pie = new Chart(document.getElementById('revPieChart'),{type:'doughnut',data:{labels:closers.map(function(c){return c[0];}),datasets:[{data:cRev,backgroundColor:cDim,borderColor:cColors,borderWidth:2,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{color:'rgba(255,255,255,0.75)',font:{size:11},padding:14,boxWidth:12,boxHeight:12}},tooltip:{callbacks:{label:function(c){return c.label+': $'+c.raw.toLocaleString();}}}}}});
  }
}

// Init
document.addEventListener('DOMContentLoaded', function(){
  fetchAllTabs().then(function(rows){
    if (!rows.length) {
      document.getElementById('loading').innerHTML = '<div class="error-box"><strong>Could not load data</strong>All tabs failed to load. Check your internet connection and try again.</div>';
      return;
    }
    allRows = rows;
    detectCols(rows);
    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }).catch(function(e){
    document.getElementById('loading').innerHTML = '<div class="error-box"><strong>Error</strong>'+e.message+'</div>';
  });
});
</script>
