<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Sales Group — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2035;--bg2:#212840;--bg3:#262f4a;
  --grn:#4dcc6e;--grn-d:rgba(77,204,110,0.12);
  --brd:rgba(255,255,255,0.07);--brd2:rgba(255,255,255,0.12);
  --t1:#edf5ee;--t2:rgba(255,255,255,0.55);--t3:rgba(255,255,255,0.3);
}
body{background:var(--bg);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-wrap{width:100%;max-width:400px}
.login-brand{text-align:center;margin-bottom:36px}
.login-brand img{width:56px;height:56px;border-radius:12px;margin-bottom:14px}
.login-brand .name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:#fff;letter-spacing:.05em}
.login-brand .tagline{font-size:12px;color:var(--t3);margin-top:4px}
.login-card{background:var(--bg2);border:1px solid var(--brd2);border-radius:16px;padding:32px}
.login-card label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:6px}
.login-card input{width:100%;background:var(--bg);border:1px solid var(--brd2);border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;padding:11px 14px;outline:none;margin-bottom:16px;transition:border-color .15s}
.login-card input:focus{border-color:var(--grn)}
.btn-login{width:100%;background:var(--grn);color:#0a1a0f;border:none;border-radius:8px;font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;padding:12px;cursor:pointer;transition:opacity .15s;letter-spacing:.03em}
.btn-login:hover{opacity:.88}
.btn-login:disabled{opacity:.4;cursor:default}
.error{background:rgba(240,96,80,0.1);border:1px solid rgba(240,96,80,0.2);border-radius:8px;padding:10px 14px;font-size:12px;color:#f06050;margin-top:14px;display:none}
.footer-note{text-align:center;font-size:11px;color:var(--t3);margin-top:20px}
</style>
</head>

    <div class="name">Iris Sales Group</div>
    <div class="tagline">Performance Intelligence Platform</div>
  </div>
  <div class="login-card">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-login" id="login-btn" onclick="doLogin()">Sign in</button>
    <div class="error" id="error-msg">Incorrect email or password. Please try again.</div>
  </div>

</div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// Redirect if already logged in
const existing = Auth.getSession();
if (existing) {
  if (existing.role === 'admin' || existing.role === 'team') window.location.href = 'admin.html';
  else window.location.href = 'dashboard.html';
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');

  if (!email || !password) return;
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  err.style.display = 'none';

  setTimeout(() => {
    const result = Auth.login(email, password);
    if (result.success) {
      if (result.role === 'admin' || result.role === 'team') window.location.href = 'admin.html';
      else window.location.href = 'dashboard.html';
    } else {
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }, 400);
}
</script>
