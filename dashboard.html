<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Sales Group — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2035;--bg-card:#212840;--bg-card2:#262f4a;
  --brd:rgba(255,255,255,0.07);--brd2:rgba(255,255,255,0.12);
  --t1:#edf5ee;--t2:#7a9e82;--t3:rgba(255,255,255,0.3);
  --grn:#4dcc6e;--grn-d:rgba(77,204,110,0.13);
  --blu:#5ab4f0;--amb:#e8b84b;--red:#f06050;--tel:#3ddbb8;--pur:#a78bfa;
}
body{background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;min-height:100vh;font-family:'Inter',sans-serif}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;background:var(--bg-card);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:20;gap:10px;flex-wrap:wrap}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-wrap img{width:32px;height:32px;border-radius:7px}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#fff;letter-spacing:.05em}
.period-badge{font-size:11px;font-weight:600;padding:5px 12px;border-radius:6px;background:var(--grn);color:#0a1a0f}
.topbar-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.cap-label{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace}
.btn-back{background:transparent;border:1px solid var(--brd2);border-radius:7px;color:var(--t3);font-size:11px;padding:5px 12px;cursor:pointer;transition:all .15s;display:none}
.btn-back:hover{color:var(--t1)}
.btn-logout{background:transparent;border:1px solid var(--brd2);border-radius:7px;color:var(--t3);font-size:11px;padding:5px 12px;cursor:pointer}
.range-wrap{display:flex;gap:6px;align-items:center}
.range-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--brd2);background:var(--bg-card);color:var(--t3);cursor:pointer}
.range-btn.active{border-color:var(--grn);color:var(--grn);background:var(--grn-d)}
.main{padding:20px 24px;display:flex;flex-direction:column;gap:18px;max-width:1440px;margin:0 auto}
.sec-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--grn);margin-bottom:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}.grid21{grid-template-columns:1fr}}
@media(max-width:600px){.grid4{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.mcard{background:var(--bg-card);border:1px solid var(--brd);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;min-height:110px;display:flex;flex-direction:column}
.accent-bar{position:absolute;top:0;left:0;right:0;height:2px}
.mlabel{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:8px}
.mval{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;line-height:1;margin-bottom:4px}
.msub{font-size:11px;color:rgba(255,255,255,0.25);margin-top:auto;padding-top:8px}
.ccard{background:var(--bg-card);border:1px solid var(--brd);border-radius:12px;padding:18px 20px}
.ctitle{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.ctitle span{font-size:10px;color:var(--t3);font-weight:400}
.tcard{background:var(--bg-card);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.thead2{padding:14px 18px 12px;border-bottom:1px solid var(--brd);font-size:13px;font-weight:600;color:var(--t1)}
table.ct{width:100%;border-collapse:collapse}
.ct thead th{padding:9px 16px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grn);text-align:left;border-bottom:1px solid var(--brd);background:var(--bg-card2)}
.ct thead th:not(:first-child){text-align:right}
.ct tbody tr{border-bottom:1px solid rgba(255,255,255,0.04)}
.ct tbody tr:hover{background:rgba(255,255,255,0.03)}
.ct tbody td{padding:11px 16px;font-size:12px;color:var(--t1)}
.ct tbody td:not(:first-child){text-align:right;font-family:'DM Mono',monospace;font-size:11px}
.av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.cn{display:flex;align-items:center;gap:9px;font-weight:600}
.pip-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.pip-row:last-child{border-bottom:none}
.pip-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.pip-name{font-size:12px;color:rgba(255,255,255,0.7);flex:1;margin-left:10px;font-weight:500}
.pip-bar-wrap{width:80px;margin-right:12px}
.pip-bar-bg{height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.pip-bar-fill{height:100%;border-radius:3px}
.pip-n{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,0.3);margin-right:12px;width:20px;text-align:center}
.pip-v{font-family:'DM Mono',monospace;font-size:12px;color:#fff;font-weight:500;min-width:72px;text-align:right}
.stat-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.stat-row:last-child{border-bottom:none}
.stat-name{font-size:12px;color:rgba(255,255,255,0.75);font-weight:500;flex:1;min-width:70px}
.stat-bar-wrap{flex:1;margin:0 12px;background:rgba(255,255,255,0.07);border-radius:4px;height:5px;overflow:hidden}
.stat-bar{height:100%;border-radius:4px;background:var(--grn)}
.stat-val{font-family:'DM Mono',monospace;font-size:11px;color:#fff;width:24px;text-align:right}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100}
.spinner{width:32px;height:32px;border:2px solid var(--brd2);border-top-color:var(--grn);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--t3)}
.no-sheet{background:rgba(240,96,80,0.08);border:1px solid rgba(240,96,80,0.2);border-radius:10px;padding:20px;text-align:center;color:#f06050;font-size:13px;line-height:1.7}
.no-sheet strong{display:block;margin-bottom:4px;font-size:15px}
.footer{padding:14px 24px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.footer-l{display:flex;align-items:center;gap:8px;font-size:10px;color:rgba(255,255,255,0.2)}
.footer-r{font-size:10px;color:rgba(255,255,255,0.2);font-family:'DM Mono',monospace}
</style>
</head>

<script>
var currentRange='30d',allRows=[],currentClient=null,charts={};

var session=Auth.getSession();
if(session){
  if(session.role==='admin'||session.role==='team'){
    document.getElementById('btn-back').style.display='inline-block';
    var viewingId=sessionStorage.getItem('iris_viewing_client');
    currentClient=IRIS_CONFIG.clients.find(function(c){return c.id===viewingId;})||IRIS_CONFIG.clients[0];
  } else {
    currentClient=IRIS_CONFIG.clients.find(function(c){return c.id===session.clientId;});
  }
} else {
  currentClient=IRIS_CONFIG.clients[0];

init();
function init(){
  if(!currentClient){showError('Client not found.');return;}
  if(!currentClient.sheetUrl){showNoSheet();return;}
  document.getElementById('loading-text').textContent='Connecting to Google Sheet...';
  fetchSheet(currentClient.sheetUrl).then(function(rows){
    allRows=rows;
    render();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  }).catch(function(e){
    showError('Could not load sheet data. Check the Google Sheets URL in config.js. '+e.message);
  });
}

function fetchSheet(url){
  var rawUrl=url.replace('https://corsproxy.io/?','').replace('https://api.allorigins.win/raw?url=','');
  var proxies=[
    'https://api.allorigins.win/raw?url='+encodeURIComponent(rawUrl),
    'https://corsproxy.io/?'+rawUrl,
    rawUrl
  ];
  function tryNext(index){
    if(index>=proxies.length)return Promise.reject(new Error('All proxies failed'));
    return fetch(proxies[index]).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.text();
    }).then(function(text){
      if(!text||text.length<10)throw new Error('Empty response');
      return parseCSV(text);
    }).catch(function(e){
      console.log('Proxy '+index+' failed, trying next...');
      return tryNext(index+1);
    });
  }
  return tryNext(0);
}

function parseCSV(text){
  var lines=text.trim().split('\n');
  var headers=lines[0].split(',').map(function(h){return h.replace(/"/g,'').trim();});
  return lines.slice(1).map(function(line){
    var vals=line.split(',');
    var obj={};
    headers.forEach(function(h,i){obj[h]=(vals[i]||'').replace(/"/g,'').trim();});
    return obj;
  }).filter(function(r){return Object.values(r).some(function(v){return v;});});
}

function getDateRange(range){
  var now=new Date(),start=new Date(now);
  if(range==='7d') start.setDate(start.getDate()-7);
  else if(range==='30d') start.setDate(start.getDate()-30);
  else if(range==='90d') start.setDate(start.getDate()-90);
  else start=new Date(now.getFullYear(),now.getMonth(),1);
  return {start:start,end:now};
}

function setRange(btn,r){
  currentRange=r;
  document.querySelectorAll('.range-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function parseDate(str){if(!str)return null;var d=new Date(str);return isNaN(d)?null:d;}
function filterByRange(rows,range){
  var dr=getDateRange(range);
  var col=IRIS_CONFIG.columns.date;
  return rows.filter(function(r){var d=parseDate(r[col]);return d&&d>=dr.start&&d<=dr.end;});
}
function parseMoney(str){if(!str)return 0;var n=parseFloat(str.replace(/[$,\s]/g,''));return isNaN(n)?0:n;}
function fmt$(n){return '$'+Math.round(n).toLocaleString();}
function fmtNum(n){return Math.round(n).toLocaleString();}

function render(){
  var cols=IRIS_CONFIG.columns;
  var filtered=filterByRange(allRows,currentRange);
  var dr=getDateRange(currentRange);
  var periodStr=dr.start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' - '+dr.end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('period-badge').textContent=currentClient.name+' - '+periodStr;
  document.getElementById('footer-period').textContent=periodStr;

  var totalCash=0,totalContract=0;
  filtered.forEach(function(r){totalCash+=parseMoney(r[cols.cashCollected]);totalContract+=parseMoney(r[cols.contractValue]);});
  var deals=filtered.filter(function(r){return parseMoney(r[cols.cashCollected])>0;}).length;
  var avgCash=deals>0?totalCash/deals:0;

  var closerMap={};
  filtered.forEach(function(r){
    var closer=r[cols.closer]||'Unassigned';
    if(!closerMap[closer])closerMap[closer]={cash:0,contract:0,deals:0};
    closerMap[closer].cash+=parseMoney(r[cols.cashCollected]);
    closerMap[closer].contract+=parseMoney(r[cols.contractValue]);
    if(parseMoney(r[cols.cashCollected])>0)closerMap[closer].deals++;
  });
  var closers=Object.entries(closerMap).sort(function(a,b){return b[1].cash-a[1].cash;});

  var setterMap={};
  filtered.forEach(function(r){
    var setter=r[cols.setter]||'';
    if(!setter||setter==='N/A')return;
    setter.split('/').forEach(function(n){n=n.trim();if(!setterMap[n])setterMap[n]=0;setterMap[n]++;});
  });
  var setters=Object.entries(setterMap).sort(function(a,b){return b[1]-a[1];});

  var productMap={};
  filtered.forEach(function(r){
    var p=r[cols.product]||'Other';
    if(p.toUpperCase().indexOf('TOP')>-1)p='TOP Program';
    else if(p.toLowerCase().indexOf('renewal')>-1)p='Renewal';
    else if(p.toLowerCase().indexOf('accel')>-1)p='Accelerator';
    if(!productMap[p])productMap[p]={count:0,value:0};
    productMap[p].count++;productMap[p].value+=parseMoney(r[cols.contractValue]);
  });
  var products=Object.entries(productMap).sort(function(a,b){return b[1].value-a[1].value;});

  var dailyMap={};
  filtered.forEach(function(r){
    var d=parseDate(r[cols.date]);if(!d)return;
    var key=d.toISOString().split('T')[0];
    if(!dailyMap[key])dailyMap[key]=0;
    dailyMap[key]+=parseMoney(r[cols.cashCollected]);
  });
  var sortedDays=Object.keys(dailyMap).sort();
  var dailyLabels=sortedDays.map(function(d){var dt=new Date(d+'T12:00:00');return(dt.getMonth()+1)+'/'+dt.getDate();});
  var dailyVals=sortedDays.map(function(d){return dailyMap[d];});

  var pColors=['var(--grn)','var(--blu)','var(--amb)','var(--tel)','var(--pur)'];
  var maxProduct=products[0]?products[0][1].value:1;
  var productRows=products.map(function(p,i){
    return '<div class="pip-row"><div class="pip-dot" style="background:'+pColors[i%pColors.length]+'"></div><div class="pip-name">'+p[0]+'</div><div class="pip-bar-wrap"><div class="pip-bar-bg"><div class="pip-bar-fill" style="width:'+(p[1].value/maxProduct*100)+'%;background:'+pColors[i%pColors.length]+'"></div></div></div><div class="pip-n">'+p[1].count+'</div><div class="pip-v">'+fmt$(p[1].value)+'</div></div>';
  }).join('');

  var maxSetter=setters[0]?setters[0][1]:1;
  var setterRows=setters.map(function(s){
    return '<div class="stat-row"><div class="stat-name">'+s[0]+'</div><div class="stat-bar-wrap"><div class="stat-bar" style="width:'+(s[1]/maxSetter*100)+'%"></div></div><div class="stat-val">'+s[1]+'</div></div>';
  }).join('');

  var closerRows=closers.map(function(c,i){
    var color=CLOSER_COLORS[i%CLOSER_COLORS.length];
    var avg=c[1].deals>0?c[1].cash/c[1].deals:0;
    return '<tr><td><div class="cn"><div class="av" style="background:'+color+'22;color:'+color+'">'+c[0].charAt(0)+'</div>'+c[0]+'</div></td><td style="color:#fff;font-weight:600">'+fmt$(c[1].cash)+'</td><td>'+fmt$(c[1].contract)+'</td><td>'+fmtNum(c[1].deals)+'</td><td>'+fmt$(c[1].cash/Math.max(c[1].deals,1))+'</td><td>'+fmt$(avg)+'</td></tr>';
  }).join('');

  document.getElementById('main-content').innerHTML=
    '<div><div class="sec-label">Revenue &amp; cash</div><div class="grid4">'+
    '<div class="mcard"><div class="accent-bar" style="background:var(--grn)"></div><div class="mlabel">Cash Collected</div><div class="mval" style="color:var(--grn)">'+fmt$(totalCash)+'</div><div class="msub">'+deals+' deals this period</div></div>'+
    '<div class="mcard"><div class="accent-bar" style="background:var(--tel)"></div><div class="mlabel">Total Contract Value</div><div class="mval" style="color:var(--tel)">'+fmt$(totalContract)+'</div><div class="msub">Full program values</div></div>'+
    '<div class="mcard"><div class="accent-bar" style="background:var(--blu)"></div><div class="mlabel">Deals Closed</div><div class="mval" style="color:var(--blu)">'+fmtNum(deals)+'</div><div class="msub">Cash collected &gt; $0</div></div>'+
    '<div class="mcard"><div class="accent-bar" style="background:var(--amb)"></div><div class="mlabel">Avg Cash / Deal</div><div class="mval" style="color:var(--amb)">'+fmt$(avgCash)+'</div><div class="msub">Cash divided by deals</div></div>'+
    '</div></div>'+
    '<div><div class="sec-label">Closer performance</div><div class="tcard"><div class="thead2">Individual closer breakdown</div><div style="overflow-x:auto"><table class="ct"><thead><tr><th>Closer</th><th>Cash Collected</th><th>Contract Value</th><th>Deals Won</th><th>Avg Cash / Deal</th><th>Avg Cash Collected</th></tr></thead><tbody>'+(closerRows||'<tr><td colspan="6" style="text-align:center;color:rgba(255,255,255,0.3);padding:20px">No data for this period</td></tr>')+'</tbody></table></div></div></div>'+
    '<div class="grid21"><div class="ccard"><div class="ctitle">Cash collected by day <span>'+periodStr+'</span></div><div style="position:relative;height:190px"><canvas id="revChart"></canvas></div></div>'+
    '<div class="ccard"><div class="ctitle">Product mix</div>'+(productRows||'<div style="color:rgba(255,255,255,0.3);font-size:12px">No data</div>')+
    '<div class="ctitle" style="margin-top:18px;margin-bottom:10px">Deals set by setter</div>'+(setterRows||'<div style="color:rgba(255,255,255,0.3);font-size:12px">No data</div>')+'</div></div>'+
    '<div class="grid2"><div class="ccard"><div class="ctitle">Revenue by closer</div><div style="position:relative;height:200px"><canvas id="closerRevChart"></canvas></div></div>'+
    '<div class="ccard"><div class="ctitle">Cash collected by closer</div><div style="position:relative;height:200px"><canvas id="closerCashChart"></canvas></div></div></div>'+
    '<div class="ccard"><div class="ctitle">Signed revenue distribution by closer</div><div style="position:relative;height:240px"><canvas id="revPieChart"></canvas></div></div>';

  Object.values(charts).forEach(function(c){c.destroy();});charts={};
  var gc='rgba(255,255,255,0.05)',tc='rgba(255,255,255,0.25)';
  var closerNames=closers.map(function(c){return c[0].split(' ')[0];});
  var closerCash=closers.map(function(c){return Math.round(c[1].cash);});
  var closerRev=closers.map(function(c){return Math.round(c[1].contract);});
  var closerColors=closers.map(function(_,i){return CLOSER_COLORS[i%CLOSER_COLORS.length];});
  var closerDim=closers.map(function(_,i){return CLOSER_DIM[i%CLOSER_DIM.length];});

  if(dailyLabels.length){
    charts.rev=new Chart(document.getElementById('revChart'),{type:'bar',data:{labels:dailyLabels,datasets:[{data:dailyVals,backgroundColor:'rgba(77,204,110,0.65)',borderColor:'#4dcc6e',borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '$'+Math.round(c.raw).toLocaleString();}}}},scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:9},autoSkip:true,maxTicksLimit:15,maxRotation:45}},y:{grid:{color:gc},ticks:{color:tc,font:{size:9},callback:function(v){return v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v;}}}}}});
  }
  if(closerNames.length){
    charts.closerRev=new Chart(document.getElementById('closerRevChart'),{type:'bar',data:{labels:closerNames,datasets:[{data:closerRev,backgroundColor:closerDim,borderColor:closerColors,borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '$'+c.raw.toLocaleString();}}}},scales:{x:{grid:{color:gc},ticks:{color:'rgba(255,255,255,0.5)',font:{size:11}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:9},callback:function(v){return '$'+(v/1000).toFixed(0)+'k';}}}}}});
    charts.closerCash=new Chart(document.getElementById('closerCashChart'),{type:'bar',data:{labels:closerNames,datasets:[{data:closerCash,backgroundColor:closerDim,borderColor:closerColors,borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '$'+c.raw.toLocaleString();}}}},scales:{x:{grid:{color:gc},ticks:{color:'rgba(255,255,255,0.5)',font:{size:11}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:9},callback:function(v){return '$'+(v/1000).toFixed(0)+'k';}}}}}});
    charts.pie=new Chart(document.getElementById('revPieChart'),{type:'doughnut',data:{labels:closers.map(function(c){return c[0];}),datasets:[{data:closerRev,backgroundColor:closerDim,borderColor:closerColors,borderWidth:2,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{color:'rgba(255,255,255,0.75)',font:{size:11},padding:14,boxWidth:12,boxHeight:12}},tooltip:{callbacks:{label:function(c){return c.label+': $'+c.raw.toLocaleString();}}}}}});
  }
}

function showNoSheet(){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('main-content').innerHTML='<div class="no-sheet"><strong>No Google Sheet connected</strong>Open config.js and paste your Google Sheets CSV URL into the sheetUrl field for '+currentClient.name+'.</div>';
}
function showError(msg){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('main-content').innerHTML='<div class="no-sheet"><strong>Error loading data</strong>'+msg+'</div>';
}
<\/script>
